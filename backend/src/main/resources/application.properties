# ============================================================
# FreelanceHub - Application Configuration
# All sensitive values are read from environment variables.
# Set these in your shell or in GitHub Actions secrets.
# ============================================================

# Server
server.port=${SERVER_PORT:8080}

# ---- Database -----------------------------------------------
# Local dev:  export DB_URL=jdbc:mysql://localhost:3306/freelancehub
# EC2:        set these in /etc/environment on your EC2 instance
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/freelancehub?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----------------------------------------
# update  = creates tables on first run, alters on schema change (dev-friendly)
# validate = only validates schema matches entities (use for prod)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----------------------------------------------------
# Generate a strong secret: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTSigningThatShouldBeChangedInProduction2024}
# Token validity: 86400000 ms = 24 hours
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ---- AWS S3 (optional) --------------------------------------
app.aws.region=${AWS_REGION:us-east-1}
app.aws.s3.bucket=${AWS_S3_BUCKET:freelancehub-profiles}
# AWS credentials are picked up from environment variables automatically:
# AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY

# ---- File Upload --------------------------------------------
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ---- Logging ------------------------------------------------
logging.level.com.freelancehub=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
