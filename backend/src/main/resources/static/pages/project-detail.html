<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Project – FreelanceHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container py-5" id="page-content">
  <!-- Skeleton -->
  <div class="placeholder-glow">
    <div class="placeholder col-6 mb-3 rounded" style="height:32px"></div>
    <div class="placeholder col-3 mb-4 rounded"></div>
    <div class="placeholder col-12 mb-2 rounded"></div>
    <div class="placeholder col-10 rounded"></div>
  </div>
</div>

<!-- Submit Bid Modal -->
<div class="modal fade" id="bidModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-700">Submit Your Bid</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="bid-alert"></div>
        <form id="bid-form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="bid-amount">Your Bid Amount (USD)</label>
            <div class="input-group">
              <span class="input-group-text">$</span>
              <input type="number" class="form-control" id="bid-amount"
                     min="1" step="1" placeholder="e.g. 450" required/>
            </div>
            <div class="form-text" id="budget-hint"></div>
            <div class="invalid-feedback">Please enter a valid bid amount.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="bid-proposal">Your Proposal</label>
            <textarea class="form-control" id="bid-proposal" rows="5" required
                      minlength="20"
                      placeholder="Describe your approach, relevant experience, and why you're the best fit for this project…"></textarea>
            <div class="form-text"><span id="char-count">0</span> / 20 min characters</div>
            <div class="invalid-feedback">Proposal must be at least 20 characters.</div>
          </div>
        </form>
      </div>
      <div class="modal-footer border-0 pt-0">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary px-4" id="submit-bid-btn">
          <i class="bi bi-send me-2"></i>Submit Bid
        </button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
  renderNavbar();

  const projectId = new URLSearchParams(location.search).get('id');
  if (!projectId) window.location.href = '/pages/projects.html';

  let project = null;
  let bidModal = null;

  // Character counter for proposal textarea
  document.getElementById('bid-proposal').addEventListener('input', function() {
    document.getElementById('char-count').textContent = this.value.length;
  });

  async function loadProject() {
    try {
      const res = await ProjectsAPI.getById(projectId);
      project = res.data;
      renderProject(project);

      // If current user is the CLIENT owner, load bids
      if (Auth.isLoggedIn() && Auth.isClient() &&
          Auth.getUserId() == project.clientId) {
        loadBids();
      }
    } catch (err) {
      document.getElementById('page-content').innerHTML = `
        <div class="text-center py-5">
          <div class="display-1 mb-3">😕</div>
          <h3>Project not found</h3>
          <p class="text-muted">${err.message}</p>
          <a href="/pages/projects.html" class="btn btn-primary">Browse Projects</a>
        </div>`;
    }
  }

  function renderProject(p) {
    const isOwner = Auth.isLoggedIn() && Auth.isClient() && Auth.getUserId() == p.clientId;
    const canBid  = Auth.isLoggedIn() && Auth.isFreelancer() && p.status === 'OPEN';

    document.title = `${p.title} – FreelanceHub`;

    document.getElementById('page-content').innerHTML = `
      <!-- Breadcrumb -->
      <nav aria-label="breadcrumb" class="mb-4">
        <ol class="breadcrumb">
          <li class="breadcrumb-item"><a href="/">Home</a></li>
          <li class="breadcrumb-item"><a href="/pages/projects.html">Projects</a></li>
          <li class="breadcrumb-item active">${p.title}</li>
        </ol>
      </nav>

      <div class="row g-4">
        <!-- Left: Project details -->
        <div class="col-lg-8">
          <div class="card p-4 mb-4">
            <div class="d-flex justify-content-between align-items-start mb-3">
              ${UI.statusBadge(p.status)}
              ${isOwner ? `
                <button class="btn btn-sm btn-outline-danger" onclick="deleteProject()">
                  <i class="bi bi-trash me-1"></i>Delete
                </button>` : ''}
            </div>
            <h1 class="h3 fw-800 mb-3">${p.title}</h1>
            <p class="text-muted" style="white-space:pre-wrap">${p.description}</p>
          </div>

          <!-- Bids section (shown to owner or after bid submission) -->
          ${isOwner ? `
          <div class="card p-4" id="bids-section">
            <h5 class="fw-700 mb-3">
              <i class="bi bi-chat-left-dots me-2 text-primary-custom"></i>
              Bids Received
              <span class="badge bg-primary ms-2" id="bid-badge">${p.bidCount}</span>
            </h5>
            <div id="bids-container">
              <div class="text-center py-3 text-muted">
                <div class="spinner-border spinner-border-sm me-2"></div>Loading bids…
              </div>
            </div>
          </div>` : canBid ? `
          <div class="card p-4 border-primary-soft bg-primary-soft" id="bid-cta">
            <div class="d-flex align-items-center gap-3">
              <div class="flex-shrink-0 text-primary-custom fs-2">💼</div>
              <div class="flex-grow-1">
                <h6 class="fw-700 mb-1">Interested in this project?</h6>
                <p class="mb-0 text-muted small">Submit a competitive bid and tell the client why you're the right fit.</p>
              </div>
              <button class="btn btn-primary flex-shrink-0" id="open-bid-btn">
                <i class="bi bi-send me-2"></i>Place Bid
              </button>
            </div>
          </div>` : !Auth.isLoggedIn() ? `
          <div class="card p-4 text-center">
            <p class="mb-3 text-muted">Sign in as a freelancer to submit a bid</p>
            <a href="/pages/login.html" class="btn btn-primary">Sign In</a>
          </div>` : ''}
        </div>

        <!-- Right: Summary sidebar -->
        <div class="col-lg-4">
          <div class="card p-4 mb-3">
            <h6 class="fw-700 text-muted text-uppercase small mb-3">Project Summary</h6>
            <div class="d-flex justify-content-between py-2 border-bottom">
              <span class="text-muted small">Budget</span>
              <span class="fw-700 text-primary-custom">${UI.currency(p.budget)}</span>
            </div>
            <div class="d-flex justify-content-between py-2 border-bottom">
              <span class="text-muted small">Deadline</span>
              <span class="fw-600">${UI.date(p.deadline)}</span>
            </div>
            <div class="d-flex justify-content-between py-2 border-bottom">
              <span class="text-muted small">Bids</span>
              <span class="fw-600">${p.bidCount} received</span>
            </div>
            <div class="d-flex justify-content-between py-2">
              <span class="text-muted small">Posted</span>
              <span class="fw-600">${p.createdAt ? UI.date(p.createdAt) : 'Recently'}</span>
            </div>
          </div>

          <!-- Client info -->
          <div class="card p-4">
            <h6 class="fw-700 text-muted text-uppercase small mb-3">Posted By</h6>
            <div class="d-flex align-items-center gap-3">
              <div class="avatar-placeholder">${UI.initials(p.clientName)}</div>
              <div>
                <div class="fw-700">${p.clientName}</div>
                <div class="text-muted small">Client</div>
              </div>
            </div>
          </div>
        </div>
      </div>`;

    // Attach bid button listener
    document.getElementById('open-bid-btn')?.addEventListener('click', () => {
      document.getElementById('budget-hint').textContent =
        `Client's budget is ${UI.currency(p.budget)}`;
      document.getElementById('bid-amount').placeholder =
        Math.round(p.budget * 0.85);
      bidModal = new bootstrap.Modal(document.getElementById('bidModal'));
      bidModal.show();
    });
  }

  async function loadBids() {
    try {
      const res = await BidsAPI.getForProject(projectId);
      const bids = res.data;
      const container = document.getElementById('bids-container');
      document.getElementById('bid-badge').textContent = bids.length;

      if (bids.length === 0) {
        UI.emptyState(container, '📭', 'No bids yet', 'Share your project to attract freelancers.');
        return;
      }

      container.innerHTML = bids.map(b => `
        <div class="card bid-card ${b.status.toLowerCase()} p-3 mb-3">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <div class="d-flex align-items-center gap-2">
              <div class="avatar-placeholder" style="width:36px;height:36px;font-size:.8rem">
                ${UI.initials(b.freelancerName)}
              </div>
              <div>
                <div class="fw-700">${b.freelancerName}</div>
                <div class="text-muted small">${UI.date(b.createdAt)}</div>
              </div>
            </div>
            <div class="text-end">
              <div class="fw-800 text-primary-custom">${UI.currency(b.bidAmount)}</div>
              ${UI.statusBadge(b.status)}
            </div>
          </div>
          <p class="mb-2 small text-muted">${b.proposal}</p>
          ${b.status === 'PENDING' && project?.status === 'OPEN' ? `
            <button class="btn btn-success btn-sm mt-1" onclick="acceptBid(${b.id})">
              <i class="bi bi-check2-circle me-1"></i>Accept This Bid
            </button>` : ''}
        </div>`).join('');
    } catch (err) {
      console.error('Could not load bids:', err);
    }
  }

  async function acceptBid(bidId) {
    if (!confirm('Accept this bid? All other bids will be rejected.')) return;
    try {
      await BidsAPI.accept(bidId);
      UI.toast('Bid accepted! The project is now in progress.', 'success');
      loadProject();
    } catch (err) {
      UI.toast(err.message, 'error');
    }
  }

  async function deleteProject() {
    if (!confirm('Delete this project? This action cannot be undone.')) return;
    try {
      await ProjectsAPI.delete(projectId);
      UI.toast('Project deleted', 'success');
      setTimeout(() => window.location.href = '/pages/dashboard.html', 1000);
    } catch (err) {
      UI.toast(err.message, 'error');
    }
  }

  // Bid form submission
  document.getElementById('submit-bid-btn').addEventListener('click', async () => {
    const form = document.getElementById('bid-form');
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }

    const amount   = parseFloat(document.getElementById('bid-amount').value);
    const proposal = document.getElementById('bid-proposal').value.trim();
    const btn      = document.getElementById('submit-bid-btn');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Submitting…';

    try {
      await BidsAPI.submit(projectId, proposal, amount);
      bidModal.hide();
      UI.toast('Your bid was submitted! ✅', 'success');
      document.getElementById('bid-cta')?.remove();
    } catch (err) {
      document.getElementById('bid-alert').innerHTML = `
        <div class="alert alert-danger py-2 small">${err.message}</div>`;
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-send me-2"></i>Submit Bid';
    }
  });

  loadProject();
</script>
</body>
</html>
