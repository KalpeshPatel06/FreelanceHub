<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard – FreelanceHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
<div id="navbar-placeholder"></div>

<div class="container py-5">
  <div id="dashboard-content">
    <!-- Loading skeleton -->
    <div class="placeholder-glow">
      <div class="placeholder col-4 mb-2 rounded" style="height:28px"></div>
      <div class="placeholder col-2 mb-5 rounded"></div>
      <div class="row g-4">
        <div class="col-md-3"><div class="placeholder col-12 rounded" style="height:100px"></div></div>
        <div class="col-md-3"><div class="placeholder col-12 rounded" style="height:100px"></div></div>
        <div class="col-md-3"><div class="placeholder col-12 rounded" style="height:100px"></div></div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
  renderNavbar();
  Auth.requireAuth();

  async function loadDashboard() {
    const role = Auth.getRole();
    const name = Auth.getName();
    const container = document.getElementById('dashboard-content');

    try {
      if (role === 'CLIENT') {
        await renderClientDashboard(container, name);
      } else {
        await renderFreelancerDashboard(container, name);
      }
    } catch (err) {
      container.innerHTML = `<div class="alert alert-danger">${err.message}</div>`;
    }
  }

  async function renderClientDashboard(container, name) {
    const res = await ProjectsAPI.getMyProjects();
    const projects = res.data;
    const open = projects.filter(p => p.status === 'OPEN').length;
    const inProgress = projects.filter(p => p.status === 'IN_PROGRESS').length;
    const totalBids = projects.reduce((sum, p) => sum + p.bidCount, 0);

    container.innerHTML = `
      <!-- Header -->
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
        <div>
          <h1 class="section-title mb-1">Welcome back, ${name}! 👋</h1>
          <span class="status-pill badge-open">Client Account</span>
        </div>
        <a href="/pages/post-project.html" class="btn btn-primary">
          <i class="bi bi-plus-circle me-2"></i>Post New Project
        </a>
      </div>

      <!-- Stats -->
      <div class="row g-3 mb-5">
        <div class="col-sm-6 col-lg-3">
          <div class="card stat-card bg-primary text-white">
            <div class="number">${projects.length}</div>
            <div class="label">Total Projects</div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="card stat-card" style="background:#DCFCE7">
            <div class="number" style="color:#16A34A">${open}</div>
            <div class="label" style="color:#16A34A">Open</div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="card stat-card" style="background:#FEF3C7">
            <div class="number" style="color:#D97706">${inProgress}</div>
            <div class="label" style="color:#D97706">In Progress</div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="card stat-card" style="background:#EFF6FF">
            <div class="number" style="color:#2563EB">${totalBids}</div>
            <div class="label" style="color:#2563EB">Total Bids</div>
          </div>
        </div>
      </div>

      <!-- Projects list -->
      <h5 class="fw-700 mb-3">My Projects</h5>
      <div id="client-projects">
        ${projects.length === 0
          ? `<div class="empty-state">
               <div class="icon">📋</div>
               <h5>No projects yet</h5>
               <p>Post your first project to start receiving bids.</p>
               <a href="/pages/post-project.html" class="btn btn-primary">Post a Project</a>
             </div>`
          : projects.map(p => `
              <div class="card mb-3 p-3 project-card"
                   onclick="location.href='/pages/project-detail.html?id=${p.id}'">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                  <div class="flex-grow-1">
                    <h6 class="fw-700 mb-1">${p.title}</h6>
                    <div class="d-flex gap-3 meta">
                      <span><i class="bi bi-cash me-1"></i>${UI.currency(p.budget)}</span>
                      <span><i class="bi bi-calendar me-1"></i>${UI.date(p.deadline)}</span>
                      <span><i class="bi bi-chat-left-dots me-1"></i>${p.bidCount} bid${p.bidCount !== 1 ? 's' : ''}</span>
                    </div>
                  </div>
                  <div class="d-flex align-items-center gap-2">
                    ${UI.statusBadge(p.status)}
                    <i class="bi bi-chevron-right text-muted"></i>
                  </div>
                </div>
              </div>`).join('')
        }
      </div>`;
  }

  async function renderFreelancerDashboard(container, name) {
    const res = await BidsAPI.getMyBids();
    const bids = res.data;
    const pending  = bids.filter(b => b.status === 'PENDING').length;
    const accepted = bids.filter(b => b.status === 'ACCEPTED').length;
    const earnings = bids
      .filter(b => b.status === 'ACCEPTED')
      .reduce((sum, b) => sum + parseFloat(b.bidAmount), 0);

    container.innerHTML = `
      <!-- Header -->
      <div class="d-flex justify-content-between align-items-start flex-wrap gap-3 mb-4">
        <div>
          <h1 class="section-title mb-1">Welcome back, ${name}! 👋</h1>
          <span class="status-pill badge-completed">Freelancer Account</span>
        </div>
        <a href="/pages/projects.html" class="btn btn-primary">
          <i class="bi bi-search me-2"></i>Browse Projects
        </a>
      </div>

      <!-- Stats -->
      <div class="row g-3 mb-5">
        <div class="col-sm-6 col-lg-3">
          <div class="card stat-card bg-primary text-white">
            <div class="number">${bids.length}</div>
            <div class="label">Total Bids</div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="card stat-card" style="background:#EFF6FF">
            <div class="number" style="color:#2563EB">${pending}</div>
            <div class="label" style="color:#2563EB">Pending</div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="card stat-card" style="background:#DCFCE7">
            <div class="number" style="color:#16A34A">${accepted}</div>
            <div class="label" style="color:#16A34A">Accepted</div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="card stat-card" style="background:#F0FDF4">
            <div class="number" style="color:#16A34A; font-size:1.6rem">${UI.currency(earnings)}</div>
            <div class="label" style="color:#16A34A">Won Value</div>
          </div>
        </div>
      </div>

      <!-- Bids list -->
      <h5 class="fw-700 mb-3">My Bids</h5>
      <div id="freelancer-bids">
        ${bids.length === 0
          ? `<div class="empty-state">
               <div class="icon">💼</div>
               <h5>No bids submitted yet</h5>
               <p>Browse open projects and submit your first bid!</p>
               <a href="/pages/projects.html" class="btn btn-primary">Browse Projects</a>
             </div>`
          : bids.map(b => `
              <div class="card mb-3 p-3 bid-card ${b.status.toLowerCase()}"
                   onclick="location.href='/pages/project-detail.html?id=${b.projectId}'">
                <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                  <div class="flex-grow-1">
                    <h6 class="fw-700 mb-1">${b.projectTitle}</h6>
                    <p class="text-muted small mb-1" style="display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden">
                      ${b.proposal}
                    </p>
                    <span class="meta"><i class="bi bi-clock me-1"></i>${UI.date(b.createdAt)}</span>
                  </div>
                  <div class="text-end">
                    <div class="fw-800 text-primary-custom">${UI.currency(b.bidAmount)}</div>
                    ${UI.statusBadge(b.status)}
                  </div>
                </div>
              </div>`).join('')
        }
      </div>`;
  }

  loadDashboard();
</script>
</body>
</html>
