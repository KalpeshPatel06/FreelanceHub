<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In – FreelanceHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
<div class="auth-wrapper">
  <div class="card auth-card shadow">

    <div class="text-center mb-4">
      <a href="/" class="auth-logo text-decoration-none">FreelanceHub</a>
      <p class="text-muted mt-1 mb-0">Sign in to your account</p>
    </div>

    <!-- Session expired notice -->
    <div id="expired-notice" class="d-none alert alert-warning py-2 small mb-3">
      <i class="bi bi-clock-history me-1"></i>
      Your session expired. Please sign in again.
    </div>

    <div id="alert-area"></div>

    <form id="login-form" novalidate>
      <div class="mb-3">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" class="form-control" id="email"
               placeholder="alice@example.com" required/>
        <div class="invalid-feedback">Please enter a valid email.</div>
      </div>

      <div class="mb-4">
        <div class="d-flex justify-content-between">
          <label class="form-label" for="password">Password</label>
        </div>
        <div class="input-group">
          <input type="password" class="form-control" id="password"
                 placeholder="Your password" required/>
          <button class="btn btn-outline-secondary" type="button" id="toggle-pw" tabindex="-1">
            <i class="bi bi-eye" id="pw-icon"></i>
          </button>
        </div>
        <div class="invalid-feedback">Password is required.</div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2" id="submit-btn">
        Sign In
      </button>
    </form>

    <!-- Demo credentials hint for portfolio reviewers -->
    <div class="mt-3 p-3 bg-light rounded border small">
      <strong><i class="bi bi-info-circle me-1"></i>Demo Accounts</strong><br/>
      Client: <code>client@demo.com</code> / <code>password123</code><br/>
      Freelancer: <code>freelancer@demo.com</code> / <code>password123</code>
    </div>

    <hr class="my-4"/>
    <p class="text-center text-muted mb-0 small">
      Don't have an account?
      <a href="/pages/register.html" class="fw-600 text-decoration-none">Sign up free</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
  if (Auth.isLoggedIn()) window.location.href = '/pages/dashboard.html';

  if (new URLSearchParams(location.search).get('expired') === 'true') {
    document.getElementById('expired-notice').classList.remove('d-none');
  }

  document.getElementById('toggle-pw').addEventListener('click', () => {
    const pw = document.getElementById('password');
    const icon = document.getElementById('pw-icon');
    pw.type = pw.type === 'password' ? 'text' : 'password';
    icon.classList.toggle('bi-eye');
    icon.classList.toggle('bi-eye-slash');
  });

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;
    if (!form.checkValidity()) { form.classList.add('was-validated'); return; }

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('submit-btn');
    const alertArea = document.getElementById('alert-area');

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Signing in…';
    alertArea.innerHTML = '';

    try {
      const res = await AuthAPI.login(email, password);
      Auth.save(res.data);
      UI.toast('Welcome back! 👋', 'success');
      setTimeout(() => window.location.href = '/pages/dashboard.html', 700);
    } catch (err) {
      alertArea.innerHTML = `
        <div class="alert alert-danger d-flex align-items-center gap-2 mb-3">
          <i class="bi bi-exclamation-circle-fill"></i>
          <span>${err.message || 'Invalid email or password'}</span>
        </div>`;
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  });
</script>
</body>
</html>
