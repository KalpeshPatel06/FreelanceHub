<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register – FreelanceHub</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body>
<div class="auth-wrapper">
  <div class="card auth-card shadow">

    <!-- Logo -->
    <div class="text-center mb-4">
      <a href="/" class="auth-logo text-decoration-none">FreelanceHub</a>
      <p class="text-muted mt-1 mb-0">Create your free account</p>
    </div>

    <!-- Role toggle -->
    <div class="btn-group w-100 mb-4" role="group" id="role-toggle">
      <input type="radio" class="btn-check" name="roleBtn" id="roleClient"
             value="CLIENT" autocomplete="off" checked/>
      <label class="btn btn-outline-primary" for="roleClient">
        <i class="bi bi-briefcase me-2"></i>I'm a Client
      </label>
      <input type="radio" class="btn-check" name="roleBtn" id="roleFreelancer"
             value="FREELANCER" autocomplete="off"/>
      <label class="btn btn-outline-primary" for="roleFreelancer">
        <i class="bi bi-laptop me-2"></i>I'm a Freelancer
      </label>
    </div>

    <!-- Alert area -->
    <div id="alert-area"></div>

    <!-- Form -->
    <form id="register-form" novalidate>
      <div class="mb-3">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" class="form-control" id="name"
               placeholder="Alice Johnson" required minlength="2"/>
        <div class="invalid-feedback">Please enter your name (min 2 characters).</div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" class="form-control" id="email"
               placeholder="alice@example.com" required/>
        <div class="invalid-feedback">Please enter a valid email address.</div>
      </div>

      <div class="mb-4">
        <label class="form-label" for="password">Password</label>
        <div class="input-group">
          <input type="password" class="form-control" id="password"
                 placeholder="At least 8 characters" required minlength="8"/>
          <button class="btn btn-outline-secondary" type="button" id="toggle-pw"
                  tabindex="-1">
            <i class="bi bi-eye" id="pw-icon"></i>
          </button>
        </div>
        <div class="invalid-feedback">Password must be at least 8 characters.</div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2" id="submit-btn">
        Create Account
      </button>
    </form>

    <hr class="my-4"/>
    <p class="text-center text-muted mb-0 small">
      Already have an account?
      <a href="/pages/login.html" class="fw-600 text-decoration-none">Sign in</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script>
  // If already logged in, go to dashboard
  if (Auth.isLoggedIn()) window.location.href = '/pages/dashboard.html';

  // Pre-select role from URL param (?role=FREELANCER)
  const urlRole = new URLSearchParams(location.search).get('role');
  if (urlRole === 'FREELANCER') document.getElementById('roleFreelancer').checked = true;

  // Password show/hide toggle
  document.getElementById('toggle-pw').addEventListener('click', () => {
    const pw = document.getElementById('password');
    const icon = document.getElementById('pw-icon');
    if (pw.type === 'password') {
      pw.type = 'text';
      icon.classList.replace('bi-eye', 'bi-eye-slash');
    } else {
      pw.type = 'password';
      icon.classList.replace('bi-eye-slash', 'bi-eye');
    }
  });

  // Form submission
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = e.target;

    // Browser-native validation
    if (!form.checkValidity()) {
      form.classList.add('was-validated');
      return;
    }

    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const role     = document.querySelector('input[name="roleBtn"]:checked').value;

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account…';

    const alertArea = document.getElementById('alert-area');
    alertArea.innerHTML = '';

    try {
      const res = await AuthAPI.register(name, email, password, role);
      Auth.save(res.data);
      UI.toast('Account created! Welcome to FreelanceHub 🎉', 'success');
      setTimeout(() => window.location.href = '/pages/dashboard.html', 900);
    } catch (err) {
      alertArea.innerHTML = `
        <div class="alert alert-danger d-flex align-items-center gap-2 mb-3">
          <i class="bi bi-exclamation-circle-fill"></i>
          <span>${err.message}</span>
        </div>`;
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  });
</script>
</body>
</html>
