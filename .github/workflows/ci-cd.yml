name: FreelanceHub CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run tests
        run: mvn -B clean verify
        working-directory: ./backend
        env:
          DB_URL: jdbc:h2:mem:testdb
          DB_USERNAME: sa
          DB_PASSWORD: ""
          JWT_SECRET: ThisIsATestSecretThatIsLongEnoughForTests1234

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: freelancehub-jar
          path: backend/target/freelancehub-*.jar
          retention-days: 1

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download JAR artifact
        uses: actions/download-artifact@v4.2.1
        with:
          name: freelancehub-jar
          path: ./deploy

      - name: List downloaded files
        run: ls -la ./deploy/

      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "./deploy/freelancehub-*.jar"
          target: "/home/${{ secrets.EC2_USERNAME }}/freelancehub/"
          strip_components: 1

      - name: Deploy and restart application on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            APP_DIR="/home/${{ secrets.EC2_USERNAME }}/freelancehub"
            cd $APP_DIR

            echo "=== Files in app directory ==="
            ls -la $APP_DIR/

            echo "=== Stopping existing application ==="
            pkill -f "java" 2>/dev/null
            sleep 5
            echo "Any existing process stopped"

            echo "=== Renaming JAR to stable name ==="
            cp $APP_DIR/freelancehub-1.0.0.jar $APP_DIR/app.jar
            echo "JAR copied to app.jar"

            echo "=== Setting environment variables ==="
            export DB_URL="${{ secrets.DB_URL }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export SERVER_PORT=8080

            echo "=== Starting application ==="
            nohup java -jar $APP_DIR/app.jar \
              --spring.datasource.url=$DB_URL \
              --spring.datasource.username=$DB_USERNAME \
              --spring.datasource.password=$DB_PASSWORD \
              --app.jwt.secret=$JWT_SECRET \
              --server.port=$SERVER_PORT \
              > $APP_DIR/app.log 2>&1 &

            echo "Application started with PID $!"
            sleep 8

            echo "=== Last 30 lines of app.log ==="
            tail -30 $APP_DIR/app.log

            echo "=== Deployment complete at $(date) ==="