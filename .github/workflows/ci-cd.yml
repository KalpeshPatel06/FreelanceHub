# ============================================================
# FreelanceHub – GitHub Actions CI/CD Pipeline
#
# TRIGGERS:
#   - Push to main branch  → full CI + CD (build, test, deploy)
#   - Pull request to main → CI only (build + test, no deploy)
#
# WHAT IT DOES:
#   CI: Checkout → Java setup → Maven build → Run tests
#   CD: SSH into EC2 → Copy JAR → Restart app
#
# REQUIRED GITHUB SECRETS (Settings → Secrets and variables → Actions):
#   EC2_HOST          - your EC2 public IP or domain
#   EC2_USERNAME      - usually 'ubuntu' or 'ec2-user'
#   EC2_SSH_KEY       - the private SSH key (.pem file contents)
#   DB_URL            - JDBC URL for your MySQL database
#   DB_USERNAME       - database username
#   DB_PASSWORD       - database password
#   JWT_SECRET        - your JWT signing secret (min 32 chars)
#   AWS_ACCESS_KEY_ID - for S3 (optional)
#   AWS_SECRET_ACCESS_KEY - for S3 (optional)
# ============================================================

name: FreelanceHub CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ============================================================
  # JOB 1: CI - Build and Test
  # Runs on every push and every pull request.
  # ============================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest   # fresh Ubuntu VM provided by GitHub (free)

    steps:
      # Step 1: Download the repository code onto the runner VM
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install Java 17 on the runner VM
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'    # Eclipse Temurin (free OpenJDK distribution)
          cache: 'maven'             # cache Maven deps → faster subsequent runs

      # Step 3: Build the project and run all unit tests
      # -B = batch mode (no interactive prompts)
      # Tests run against H2 in-memory DB (no real MySQL needed)
      - name: Build and run tests
        run: mvn -B clean verify
        working-directory: ./backend
        env:
          # Provide dummy values so the app context loads for tests
          # The test profile (application-test.properties) overrides these with H2
          DB_URL: jdbc:h2:mem:testdb
          DB_USERNAME: sa
          DB_PASSWORD: ""
          JWT_SECRET: ThisIsATestSecretThatIsLongEnoughForTests1234

      # Step 4: Save the compiled JAR as an artifact so CD job can use it
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: freelancehub-jar
          path: backend/target/freelancehub-*.jar
          retention-days: 1   # we only need it for the deploy step below

  # ============================================================
  # JOB 2: CD - Deploy to EC2
  # Only runs when a push is made to main (not on pull requests).
  # Depends on the build-and-test job succeeding first.
  # ============================================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-test   # wait for CI to pass before deploying
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Step 1: Download the JAR built in the previous job
      - name: Download JAR artifact
        uses: actions/download-artifact@v4
        with:
          name: freelancehub-jar
          path: ./artifact

      # Step 2: Copy the JAR to the EC2 server via SCP
      # appleboy/scp-action handles SSH key setup and the file copy
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          source:   "./artifact/*.jar"
          target:   "/home/${{ secrets.EC2_USERNAME }}/freelancehub/"
          strip_components: 2   # removes the 'artifact/' prefix from the path

      # Step 3: SSH into EC2 and restart the application
      # We stop the old process, rename the new JAR, then start it.
      # 'nohup' keeps the app running after the SSH session ends.
      - name: Restart application on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/freelancehub

            # Stop the currently running app (graceful)
            echo "Stopping existing application..."
            pkill -f freelancehub || true   # 'true' prevents failure if app wasn't running

            # Wait a moment for port to free up
            sleep 3

            # Rename the new JAR to a stable name so the start command never changes
            mv artifact/*.jar freelancehub.jar 2>/dev/null || true
            rm -rf artifact/

            # Export environment variables the app needs
            # These are stored safely as GitHub Secrets and injected here
            export DB_URL="${{ secrets.DB_URL }}"
            export DB_USERNAME="${{ secrets.DB_USERNAME }}"
            export DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            export JWT_SECRET="${{ secrets.JWT_SECRET }}"
            export AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}"
            export AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}"
            export SERVER_PORT=8080

            # Start the app in the background
            # nohup: don't stop when SSH session ends
            # > app.log: redirect stdout to log file
            # 2>&1: also redirect stderr to log file
            # &: run in background
            echo "Starting application..."
            nohup java -jar freelancehub.jar \
              --spring.profiles.active=prod \
              > app.log 2>&1 &

            echo "Application started with PID $!"
            echo "Deployment complete at $(date)"

      # Step 4: Verify the app is responding (simple health check)
      - name: Health check
        run: |
          echo "Waiting for application to start..."
          sleep 20
          curl -f http://${{ secrets.EC2_HOST }}:8080/actuator/health \
            && echo "✅ Application is healthy!" \
            || echo "⚠️ Health check failed - check app.log on EC2"
